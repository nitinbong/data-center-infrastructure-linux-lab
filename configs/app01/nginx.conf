user  www-data;
worker_processes  1;
pid /run/nginx-app01.pid;
error_log /home/sysadmin/data-center-lab/srv/app01/logs/error.log warn;
events { worker_connections 512; }
http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log /home/sysadmin/data-center-lab/srv/app01/logs/access.log;
    sendfile on;
    server {
        listen       10.10.10.12:8080;
        server_name  app01;
        root         /srv/appcontent;
        index        index.html;
        location /health { return 200 "OK app01\n"; add_header Content-Type text/plain; }
        location / { try_files $uri $uri/ =404; }
    }
}
