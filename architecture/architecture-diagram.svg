<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 760" width="1120" height="760" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3.2" orient="auto">
      <path d="M0,0 L9,3.2 L0,6.4 z" fill="#5b7fa6"/>
    </marker>
    <marker id="arrowg" markerWidth="10" markerHeight="10" refX="9" refY="3.2" orient="auto">
      <path d="M0,0 L9,3.2 L0,6.4 z" fill="#3f8f5f"/>
    </marker>
    <style>
      .h1   { font-size: 23px; font-weight: 700; fill: #1c2330; }
      .sub  { font-size: 13px; fill: #667488; }
      .host { font-size: 17px; font-weight: 700; fill: #1c2330; }
      .ip   { font-size: 13px; font-weight: 700; fill: #2f6fb0; font-family: monospace; }
      .lbl  { font-size: 12.5px; fill: #33404f; }
      .mono { font-size: 12px; fill: #33404f; font-family: monospace; }
      .cap  { font-size: 11.5px; fill: #77849a; }
      .box  { font-size: 12.5px; font-weight: 700; fill: #1c2330; }
      .tag  { font-size: 11px; font-weight: 700; fill: #ffffff; }
    </style>
  </defs>

  <rect width="1120" height="760" fill="#f7f9fc"/>

  <text x="40" y="44" class="h1">Data Center Infrastructure &amp; Linux Operations Home Lab</text>
  <text x="40" y="66" class="sub">Two-node Ubuntu 24.04 environment — isolated network namespaces joined by a veth pair on a private /24</text>

  <!-- host boundary -->
  <rect x="34" y="88" width="1052" height="560" rx="12" fill="#eef2f8" stroke="#c3cede" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="50" y="110" class="cap">PHYSICAL HOST — Ubuntu 24.04 LTS, kernel 6.18, root namespace</text>

  <!-- ===== web01 ===== -->
  <rect x="66" y="132" width="420" height="332" rx="10" fill="#ffffff" stroke="#8fa8c4" stroke-width="2"/>
  <rect x="66" y="132" width="420" height="40" rx="10" fill="#2f6fb0"/>
  <rect x="66" y="160" width="420" height="12" fill="#2f6fb0"/>
  <text x="86" y="159" class="tag" font-size="14">web01 — web front-end</text>
  <text x="380" y="159" class="tag" font-family="monospace">netns: web01</text>

  <text x="86" y="196" class="host">Network</text>
  <text x="86" y="216" class="mono">veth-web   10.10.10.11/24</text>
  <text x="86" y="234" class="mono">route      10.10.10.0/24 dev veth-web</text>

  <text x="86" y="264" class="host">Services</text>
  <rect x="86" y="274" width="180" height="46" rx="6" fill="#e8f1fb" stroke="#a9c4e0"/>
  <text x="98" y="292" class="box">nginx</text>
  <text x="98" y="310" class="mono">10.10.10.11:80</text>
  <rect x="278" y="274" width="180" height="46" rx="6" fill="#e8f1fb" stroke="#a9c4e0"/>
  <text x="290" y="292" class="box">sshd</text>
  <text x="290" y="310" class="mono">10.10.10.11:22</text>

  <text x="86" y="348" class="host">Content &amp; data</text>
  <text x="86" y="368" class="mono">/srv/webcontent   2775 root:webadmins</text>
  <text x="86" y="386" class="mono">/srv/data         ext4 on /dev/loop0</text>
  <text x="86" y="404" class="mono">/srv/secrets      0700 sysadmin</text>
  <text x="86" y="422" class="mono">/srv/dropbox      1777 sticky</text>
  <text x="86" y="446" class="cap">monitoring node — runs fleet_monitor.py</text>

  <!-- ===== app01 ===== -->
  <rect x="634" y="132" width="420" height="332" rx="10" fill="#ffffff" stroke="#8fa8c4" stroke-width="2"/>
  <rect x="634" y="132" width="420" height="40" rx="10" fill="#3f8f5f"/>
  <rect x="634" y="160" width="420" height="12" fill="#3f8f5f"/>
  <text x="654" y="159" class="tag" font-size="14">app01 — application back-end</text>
  <text x="948" y="159" class="tag" font-family="monospace">netns: app01</text>

  <text x="654" y="196" class="host">Network</text>
  <text x="654" y="216" class="mono">veth-app   10.10.10.12/24</text>
  <text x="654" y="234" class="mono">route      10.10.10.0/24 dev veth-app</text>

  <text x="654" y="264" class="host">Services</text>
  <rect x="654" y="274" width="180" height="46" rx="6" fill="#e9f5ee" stroke="#a8ceb8"/>
  <text x="666" y="292" class="box">nginx</text>
  <text x="666" y="310" class="mono">10.10.10.12:8080</text>
  <rect x="846" y="274" width="180" height="46" rx="6" fill="#e9f5ee" stroke="#a8ceb8"/>
  <text x="858" y="292" class="box">sshd</text>
  <text x="858" y="310" class="mono">10.10.10.12:22</text>

  <!-- firewall -->
  <rect x="654" y="340" width="372" height="104" rx="8" fill="#fdf3ec" stroke="#e0b48f" stroke-width="1.6"/>
  <text x="666" y="360" class="box">iptables — INPUT policy DROP</text>
  <text x="666" y="380" class="mono">ACCEPT  lo, ESTABLISHED/RELATED</text>
  <text x="666" y="398" class="mono">ACCEPT  icmp echo-request (5/s limit)</text>
  <text x="666" y="416" class="mono">ACCEPT  tcp/22 from 10.10.10.11 only</text>
  <text x="666" y="434" class="mono">ACCEPT  tcp/8080  →  LOG  →  DROP</text>

  <!-- ===== link ===== -->
  <line x1="486" y1="230" x2="634" y2="230" stroke="#5b7fa6" stroke-width="2.5"/>
  <text x="512" y="222" class="cap">veth pair</text>
  <text x="494" y="248" class="mono" fill="#2f6fb0">10.10.10.0/24</text>

  <!-- ping -->
  <path d="M486 288 L634 288" stroke="#5b7fa6" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M634 306 L486 306" stroke="#5b7fa6" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="500" y="282" class="cap">ICMP · HTTP :8080</text>
  <text x="500" y="326" class="cap">SSH :22 (key-based)</text>

  <!-- ===== storage layer ===== -->
  <rect x="66" y="486" width="420" height="140" rx="10" fill="#ffffff" stroke="#b9a5cd" stroke-width="2"/>
  <text x="86" y="510" class="host">Storage layer (loop-backed block devices)</text>
  <rect x="86" y="522" width="118" height="40" rx="6" fill="#f2ecf8" stroke="#c3b0d6"/>
  <text x="96" y="539" class="mono">data.img 256M</text>
  <text x="96" y="555" class="mono">/dev/loop0</text>
  <text x="212" y="546" class="mono">→ ext4 → /srv/data</text>

  <rect x="86" y="572" width="118" height="40" rx="6" fill="#f2ecf8" stroke="#c3b0d6"/>
  <text x="96" y="589" class="mono">mirror a / b</text>
  <text x="96" y="605" class="mono">+ hot spare</text>
  <text x="212" y="588" class="mono">→ RAID1 drill: fail → degraded</text>
  <text x="212" y="606" class="mono">→ rebuild → checksum verify</text>

  <!-- ===== monitoring ===== -->
  <rect x="634" y="486" width="420" height="140" rx="10" fill="#ffffff" stroke="#8fa8c4" stroke-width="2"/>
  <text x="654" y="510" class="host">Monitoring &amp; automation</text>
  <text x="654" y="532" class="mono">server-health.sh   → CPU, RAM, disk, inodes,</text>
  <text x="654" y="550" class="mono">                     ports, HTTP, peer, security</text>
  <text x="654" y="572" class="mono">fleet_monitor.py   → local + SSH collection,</text>
  <text x="654" y="590" class="mono">                     JSON, CSV history, exit codes</text>
  <text x="654" y="612" class="cap">exit 0 OK · 1 WARNING · 2 CRITICAL</text>

  <!-- monitoring flow arrows -->
  <path d="M486 556 L634 556" stroke="#3f8f5f" stroke-width="1.6" marker-end="url(#arrowg)" fill="none"/>
  <path d="M276 464 L276 486" stroke="#8f7fb0" stroke-width="1.6" fill="none"/>
  <path d="M844 464 L844 486" stroke="#5b7fa6" stroke-width="1.6" fill="none"/>

  <!-- ===== incident legend ===== -->
  <text x="40" y="682" class="host">Simulated incidents</text>
  <g class="lbl">
    <rect x="40" y="694" width="196" height="42" rx="6" fill="#ffffff" stroke="#d3623f" stroke-width="1.4"/>
    <text x="52" y="712" class="box">INC-001 network</text>
    <text x="52" y="729" class="cap">wrong subnet on app01</text>

    <rect x="252" y="694" width="196" height="42" rx="6" fill="#ffffff" stroke="#d3623f" stroke-width="1.4"/>
    <text x="264" y="712" class="box">INC-002 SSH</text>
    <text x="264" y="729" class="cap">StrictModes rejects key</text>

    <rect x="464" y="694" width="196" height="42" rx="6" fill="#ffffff" stroke="#d3623f" stroke-width="1.4"/>
    <text x="476" y="712" class="box">INC-003 service</text>
    <text x="476" y="729" class="cap">config typo + port conflict</text>

    <rect x="676" y="694" width="196" height="42" rx="6" fill="#ffffff" stroke="#d3623f" stroke-width="1.4"/>
    <text x="688" y="712" class="box">INC-004 disk full</text>
    <text x="688" y="729" class="cap">deleted file held open</text>

    <rect x="888" y="694" width="196" height="42" rx="6" fill="#ffffff" stroke="#d3623f" stroke-width="1.4"/>
    <text x="900" y="712" class="box">INC-005 permissions</text>
    <text x="900" y="729" class="cap">nginx 403 on doc root</text>
  </g>
</svg>
